services:
  - type: web
    name: vlouxe-agents-hub
    runtime: node
    plan: free
    rootDir: agents/hub
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: HUB_USERNAME
        value: vlouxe
      - key: HUB_PASSWORD
        sync: false

  - type: cron
    name: vlouxe-sales-cron
    runtime: node
    plan: free
    rootDir: agents/hub
    buildCommand: npm install
    schedule: "0 13 * * *"
    startCommand: npm run cron:sales
    envVars:
      - key: HUB_BASE_URL
        value: https://agents.vlouxe.com
      - key: HUB_USERNAME
        value: vlouxe
      - key: HUB_PASSWORD
        sync: false
