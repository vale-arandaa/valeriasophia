services:
  - type: web
    name: vlouxe-agents-hub
    runtime: node
    plan: free
    rootDir: agents/hub
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HUB_USERNAME
        value: vlouxe
      - key: HUB_PASSWORD
        sync: false
